<!DOCTYPE html>
<!--
  Parcoach 教案模板 · 自包含纯 HTML 教案
  ==============================================
  用法：复制本文件，按标注的「=========== 填写区 ===========」逐块替换内容。
  - 交互习题集：编辑 <script type="application/json" id="quiz-data"> 里的题目数组。
  - 保存后双击打开即为可用教案（含可点选作答、即时反馈、计分）。
  本文件为纯 HTML + 内联 JS，不依赖任何框架 / 网络 / 构建，可独立分发。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parcoach 教案</title>
<style>
  /* ===== 品牌主题（pbl-style-guide token，内联，无需外部文件）===== */
  :root{
    --bg:#ffffff; --bg-soft:#f7f4ef; --surface:#ffffff; --surface-2:#f1ece3;
    --border:rgba(88,105,90,.14); --border-strong:rgba(88,105,90,.26);
    --text-1:#2e3a32; --text-2:#5e6b62; --text-3:#8a948c;
    --accent:#3e7c59; --accent-2:#e8a13c; --accent-3:#7fa88c;
    --grad:linear-gradient(135deg,#3e7c59,#7fa88c 55%,#e8a13c);
    --grad-soft:linear-gradient(135deg,#eef4ef,#fbf4e8);
    --radius:16px; --radius-sm:10px; --radius-lg:24px;
    --shadow:0 6px 22px rgba(62,124,89,.10),0 2px 6px rgba(62,124,89,.06);
    --font-sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",-apple-system,Helvetica,Arial,sans-serif;
    --font-serif:"Noto Serif SC","Songti SC",Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text-1);font-family:var(--font-sans);line-height:1.7;-webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none}
  .sheet{max-width:880px;margin:0 auto;padding:56px 64px 80px}
  h1{font-family:var(--font-serif);font-size:40px;color:var(--text-1);margin:0 0 8px}
  h2{font-family:var(--font-serif);font-size:28px;color:var(--accent);margin:44px 0 14px;padding-bottom:8px;border-bottom:2px solid var(--border)}
  h3{font-family:var(--font-serif);font-size:22px;color:var(--text-1);margin:24px 0 10px}
  .cover{background:var(--grad-soft);border-radius:var(--radius-lg);padding:40px 44px;margin-bottom:8px}
  .subtitle{color:var(--text-2);font-size:18px;margin:4px 0 18px}
  .tags{display:flex;gap:10px;flex-wrap:wrap}
  .tag{background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:6px 14px;font-size:14px;color:var(--text-2)}
  .dq{background:var(--bg-soft);border-left:5px solid var(--accent-2);border-radius:var(--radius-sm);padding:18px 22px;margin:20px 0;font-size:19px}
  .dq b{color:var(--accent-2)}
  .lesson{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px 26px;margin:18px 0;box-shadow:var(--shadow)}
  .meta{font-size:14px;color:var(--text-2);margin:4px 0 14px}
  .q{display:flex;gap:10px;align-items:flex-start;margin:7px 0}
  .q .qlabel{font-weight:700}
  .q-pre .qlabel{color:var(--accent)} .q-mid .qlabel{color:var(--accent-2)} .q-post .qlabel{color:var(--accent-3)}
  .muted{color:var(--text-2)} .small{font-size:14px}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .box{background:var(--bg-soft);border-radius:var(--radius-sm);padding:16px 20px}
  .box h4{margin:0 0 6px;color:var(--accent)}
  .rule{width:100%;border-collapse:collapse;margin:14px 0}
  .rule th{background:var(--bg-soft);color:var(--text-1)}
  .rule th,.rule td{border:1px solid var(--border);padding:10px 14px;font-size:15px;text-align:left}
  ul,ol{padding-left:22px} li{margin:4px 0}

  /* ===== 交互习题 ===== */
  .quiz-head{display:flex;gap:10px;align-items:center;margin-bottom:14px}
  .quiz-q{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;margin:14px 0;box-shadow:var(--shadow)}
  .quiz-q .qtext{font-weight:600;margin-bottom:12px}
  .opt{display:block;width:100%;text-align:left;border:1px solid var(--border);border-radius:var(--radius-sm);
    padding:10px 14px;margin:6px 0;font-size:15px;background:var(--bg);cursor:pointer;font-family:var(--font-sans);transition:all .15s}
  .opt:hover{background:var(--bg-soft)}
  .opt.sel{border-color:var(--accent);background:rgba(62,124,89,.08)}
  .opt.correct{border-color:#3e7c59;background:rgba(62,124,89,.12);color:#2e5c42}
  .opt.wrong{border-color:#c0564a;background:rgba(192,86,74,.10);color:#9c3f35}
  .fb{display:none;margin-top:10px;padding:10px 14px;border-radius:var(--radius-sm);font-size:14px}
  .fb.show{display:block}
  .fb.right{background:rgba(62,124,89,.10);color:#2e5c42}
  .fb.wrong{background:rgba(232,161,60,.12);color:#9a6a1e}
  .quiz-meta{font-size:13px;color:var(--text-3);display:flex;gap:8px;align-items:center}
  .pill{background:var(--bg-soft);border:1px solid var(--border);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--text-2)}
  .submit-row{text-align:center;margin-top:20px}
  .btn{display:inline-block;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);
    padding:12px 36px;font-size:15px;cursor:pointer;font-family:var(--font-sans)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .score{text-align:center;padding:16px;border-radius:var(--radius);background:var(--bg-soft);margin-bottom:14px}
  .score b{font-size:22px;color:var(--accent)}
  @media (max-width:640px){.sheet{padding:32px 20px 60px}.split{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="sheet">

  <!-- ========= 1. 封面 ========= -->
  <div class="cover">
    <p style="color:var(--accent);font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px">Parcoach · PBL 教案</p>
    <h1>【填写：项目名称】</h1>
    <p class="subtitle">【填写：一句话副题，说清这个项目让孩子学什么】</p>
    <div class="tags"><span class="tag">【课时】</span><span class="tag">【年龄段】</span><span class="tag">【场景】</span></div>
  </div>

  <div class="dq"><b>驱动问题：</b>【填写：开放、真实、有挑战的驱动问题】</div>

  <!-- ========= 2. 学习目标 ========= -->
  <h2>学习目标</h2>
  <div class="split">
    <div class="box"><h4>知识</h4><p class="small muted">【填写】</p></div>
    <div class="box"><h4>能力</h4><p class="small muted">【填写】</p></div>
    <div class="box"><h4>情感</h4><p class="small muted">【填写】</p></div>
  </div>

  <!-- ========= 3. 每节课（复制 .lesson 块，每节课一份）=========
  <div class="lesson">
    <h3>第 N 节 · 【节名】</h3>
    <p class="meta">阶段目标：… · 材料：…</p>
    <div class="q q-pre"><div><div class="qlabel">🎯 课前启发</div><div class="muted">【问题】</div></div></div>
    <div class="q q-mid"><div><div class="qlabel">💡 课中引导</div><div class="muted">【问题】</div></div></div>
    <div class="q q-post"><div><div class="qlabel">✅ 课后小结</div><div class="muted">【问题】</div></div></div>
  </div>
  ========= -->

  <!-- ========= 4. 引导策略（可选）========= -->

  <!-- ========= 5. 最终产出 ========= -->
  <h2>最终产出与展示</h2>
  <div class="box"><h4>作品</h4><p class="small muted">【填写：海报 / 模型 / 演示 / 报告…】</p></div>

  <!-- ========= 6. Rubric ========= -->
  <h2>评价 Rubric</h2>
  <table class="rule">
    <tr><th>维度</th><th>优</th><th>良</th><th>待改进</th></tr>
    <tr><td>【维度】</td><td>【】</td><td>【】</td><td>【】</td></tr>
  </table>

  <!-- ========= 7. 适配（可选）========= -->

  <!-- ========= 8. 交互习题集（至少 10 题）========= -->
  <h2>交互练习</h2>
  <div class="score" id="scoreBox" style="display:none">得分：<b id="scoreNum">0</b> / <span id="scoreTotal">0</span></div>
  <div id="quizRoot"></div>
  <div class="submit-row">
    <button class="btn" id="submitBtn">提交答案</button>
    <span class="muted small" id="hint" style="margin-left:10px"></span>
  </div>

  <!-- ========= 9. 扩展 ========= -->
  <h2>扩展与下一步</h2>
  <ul>
    <li>【填写】</li>
  </ul>

</div>

<!-- ========= 交互题目数据（编辑这里）==========
  每题：type:"judge" 为判断题（answer 0=对,1=错）；type:"choice" 为选择题。
  options: 选择题的选项数组；判断题可省略。
  explain: 反馈文案（答对/答错都显示）。
========== -->
<script id="quiz-data" type="application/json">
{
  "questions": [
    {
      "type": "choice",
      "q": "【问题1题干】",
      "options": ["选项A", "选项B", "选项C", "选项D"],
      "answer": 0,
      "explain": "【反馈文案】"
    },
    {
      "type": "judge",
      "q": "【判断题题干】",
      "answer": 1,
      "explain": "【反馈文案】"
    }
  ]
}
</script>

<script>
/* ===== 交互习题渲染与作答逻辑（纯 JS，无需修改即可用）===== */
(function () {
  var data;
  try { data = JSON.parse(document.getElementById('quiz-data').textContent); }
  catch (e) { return; }
  var qs = data.questions || [];
  var root = document.getElementById('quizRoot');
  var href = location.href.split('#')[0];

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }

  qs.forEach(function (q, i) {
    var card = document.createElement('div');
    card.className = 'quiz-q';
    var typeLabel = q.type === 'judge' ? '判断' : '选择';
    var head = '<div class="quiz-meta"><span class="pill">第 ' + (i+1) + ' 题</span><span class="pill">' + typeLabel + '</span></div>';
    var ans = typeof q.answer === 'string' ? parseInt(q.answer,10) : q.answer;
    var body;

    if (q.type === 'judge') {
      body = ['对 ✓','错 ✗'].map(function (lab, oi) {
        return '<button type="button" class="opt" data-opt="'+oi+'">'+lab+'</button>';
      }).join('');
    } else {
      body = q.options.map(function (opt, oi) {
        var letter = String.fromCharCode(65 + oi);
        return '<button type="button" class="opt" data-opt="'+oi+'">'+letter+'. '+esc(opt)+'</button>';
      }).join('');
    }

    card.innerHTML = head + '<p class="qtext">' + esc(q.q) + '</p>' +
      '<div class="opts">' + body + '</div>' +
      '<div class="fb" data-fb="'+i+'">' + esc(q.explain||'') + '</div>';
    root.appendChild(card);
  });

  var total = qs.length;
  var answers = {}; // 题目index -> 用户选择

  root.addEventListener('click', function (ev) {
    var btn = ev.target.closest('.opt');
    if (!btn) return;
    var card = btn.closest('.quiz-q');
    var qi = Array.prototype.indexOf.call(root.children, card);
    // 单选
    card.querySelectorAll('.opt').forEach(function (o) { o.classList.remove('sel'); });
    btn.classList.add('sel');
    answers[qi] = parseInt(btn.getAttribute('data-opt'), 10);
    updateHint();
  });

  function updateHint() {
    var done = Object.keys(answers).length;
    var h = document.getElementById('hint');
    if (done < total) h.textContent = '还有 ' + (total - done) + ' 题未答';
    else h.textContent = '';
  }

  document.getElementById('submitBtn').addEventListener('click', function () {
    if (Object.keys(answers).length < total) { alert('请先答完所有题目'); return; }
    var score = 0;
    qs.forEach(function (q, i) {
      var ans = typeof q.answer === 'string' ? parseInt(q.answer,10) : q.answer;
      var card = root.children[i];
      var chosen = answers[i];
      var opts = card.querySelectorAll('.opt');
      var fb = card.querySelector('[data-fb="'+i+'"]');
      opts.forEach(function (o, oi) {
        o.disabled = true; o.classList.remove('sel');
        if (oi === ans) o.classList.add('correct');
        else if (oi === chosen) o.classList.add('wrong');
      });
      fb.classList.add('show');
      if (chosen === ans) { fb.classList.add('right'); score++; }
      else fb.classList.add('wrong');
    });
    document.getElementById('scoreBox').style.display = 'block';
    document.getElementById('scoreNum').textContent = score;
    document.getElementById('scoreTotal').textContent = total;
    var btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.textContent = '已完成';
    // 刷新按钮
    var box = document.getElementById('scoreBox');
    var again = document.createElement('button');
    again.className = 'btn'; again.style.marginTop = '10px'; again.style.background = 'var(--surface-2)';
    again.style.color = 'var(--text-1)'; again.textContent = '重新作答';
    again.onclick = function () { location.href = href; };
    box.appendChild(again);
  });
})();
</script>
</body>
</html>
